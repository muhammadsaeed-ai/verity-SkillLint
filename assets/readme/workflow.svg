<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="600" viewBox="0 0 1440 600" role="img" aria-labelledby="title desc">
<title id="title">SkillLint developer workflow</title><desc id="desc">Scan skill files, parse the format, run link security and conflict rules, review diagnostics, and gate CI using the exit status.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#060f1e"/><stop offset="1" stop-color="#12233a"/></linearGradient><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3Z" fill="#39e6cb"/></marker><style>
.h{font:700 30px system-ui,sans-serif;fill:#f4f8ff}.s{font:400 15px system-ui,sans-serif;fill:#91abc6}.t{font:700 17px system-ui,sans-serif;fill:#edf6ff}.b{font:400 14px system-ui,sans-serif;fill:#b1c6dc}.m{font:600 12px ui-monospace,monospace;fill:#9bf9e3}.c{fill:#0b1a2e;stroke:#294a6b;stroke-width:1.4}.a{fill:none;stroke:#39e6cb;stroke-width:2.8;marker-end:url(#arr)}
</style></defs>
<rect width="1440" height="600" rx="24" fill="url(#bg)"/><text x="52" y="60" class="h">From skill folder to CI decision</text><text x="54" y="88" class="s">Fast local feedback, deterministic fixtures, and reports built for code review</text>
<g>
<rect x="50" y="140" width="245" height="152" rx="15" class="c" stroke="#60a5fa"/><circle cx="79" cy="170" r="15" fill="#60a5fa"/><text x="79" y="175" text-anchor="middle" font-family="system-ui" font-weight="700" font-size="13" fill="#081326">1</text><text x="104" y="175" class="t">Discover</text><text x="73" y="210" class="b">Find skill and agent</text><text x="73" y="232" class="b">instruction files</text><text x="73" y="265" class="m">skilllint scan .</text>
<rect x="342" y="140" width="245" height="152" rx="15" class="c" stroke="#a78bfa"/><circle cx="371" cy="170" r="15" fill="#a78bfa"/><text x="371" y="175" text-anchor="middle" font-family="system-ui" font-weight="700" font-size="13" fill="#081326">2</text><text x="396" y="175" class="t">Validate</text><text x="365" y="210" class="b">Metadata, directory,</text><text x="365" y="232" class="b">body budget, YAML subset</text><text x="365" y="265" class="m">format rules</text>
<rect x="634" y="140" width="245" height="152" rx="15" class="c" stroke="#34d399"/><circle cx="663" cy="170" r="15" fill="#34d399"/><text x="663" y="175" text-anchor="middle" font-family="system-ui" font-weight="700" font-size="13" fill="#081326">3</text><text x="688" y="175" class="t">Analyze</text><text x="657" y="210" class="b">Links, permissions,</text><text x="657" y="232" class="b">unsafe patterns, conflicts</text><text x="657" y="265" class="m">content rules</text>
<rect x="926" y="140" width="245" height="152" rx="15" class="c" stroke="#fbbf24"/><circle cx="955" cy="170" r="15" fill="#fbbf24"/><text x="955" y="175" text-anchor="middle" font-family="system-ui" font-weight="700" font-size="13" fill="#081326">4</text><text x="980" y="175" class="t">Report</text><text x="949" y="210" class="b">Readable text, JSON,</text><text x="949" y="232" class="b">or SARIF for CI tooling</text><text x="949" y="265" class="m">file + line + rule ID</text>
<rect x="1218" y="140" width="172" height="152" rx="15" class="c" stroke="#fb7185"/><circle cx="1247" cy="170" r="15" fill="#fb7185"/><text x="1247" y="175" text-anchor="middle" font-family="system-ui" font-weight="700" font-size="13" fill="#081326">5</text><text x="1272" y="175" class="t">Gate</text><text x="1240" y="210" class="b">Errors</text><text x="1240" y="232" class="b">or strict warnings</text><text x="1240" y="265" class="m">exit 1</text>
<path d="M295 216 H334 M587 216 H626 M879 216 H918 M1171 216 H1210" class="a"/>
</g>
<rect x="50" y="347" width="1340" height="120" rx="16" fill="#0e2035" stroke="#294a6b"/><text x="78" y="385" class="t">Recommended pull-request workflow</text><text x="78" y="418" class="b">Run the same SkillLint version locally and in CI, publish SARIF as a review artifact, and require a human to resolve ambiguous findings.</text><text x="78" y="445" class="m">No external link crawling · no tool execution · no automatic rewrite</text>
<rect x="50" y="500" width="1340" height="50" rx="12" fill="#251d2b" stroke="#86485d"/><text x="74" y="530" font-family="system-ui" font-size="14" font-weight="700" fill="#fda4af">A passing run means no configured rules fired; it does not prove an instruction is safe or semantically consistent.</text>
<text x="1370" y="580" text-anchor="end" class="s">SKILLLINT · REVIEWABLE AUTOMATION</text></svg>