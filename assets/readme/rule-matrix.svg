<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="590" viewBox="0 0 1440 590" role="img" aria-labelledby="title desc">
<title id="title">SkillLint rule coverage map</title><desc id="desc">Categories of static checks include metadata contract, references, unsafe commands, tool permissions, instruction consistency and CI reports. Errors block CI by default, while warnings can block strict mode.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#060f1e"/><stop offset="1" stop-color="#12233a"/></linearGradient><style>
.h{font:700 30px system-ui,sans-serif;fill:#f4f8ff}.s{font:400 15px system-ui,sans-serif;fill:#91abc6}.t{font:700 17px system-ui,sans-serif;fill:#edf6ff}.b{font:400 14px system-ui,sans-serif;fill:#b1c6dc}.m{font:600 13px ui-monospace,monospace;fill:#9bf9e3}.c{fill:#0b1a2e;stroke:#294a6b;stroke-width:1.4}
</style></defs>
<rect width="1440" height="590" rx="24" fill="url(#bg)"/><text x="52" y="60" class="h">Rule coverage map</text><text x="54" y="88" class="s">Specific signals and stable IDs help teams review the why—not just a pass/fail result.</text>
<g>
<rect x="50" y="130" width="420" height="132" rx="15" class="c" stroke="#60a5fa"/><text x="76" y="166" class="t">Metadata contract</text><text x="76" y="198" class="b">Required name + description, kebab-case,</text><text x="76" y="221" class="b">directory match, size budget, common YAML forms</text><text x="76" y="246" class="m">SL001–SL017 · SLFILE001–004</text>
<rect x="510" y="130" width="420" height="132" rx="15" class="c" stroke="#34d399"/><text x="536" y="166" class="t">References and packaging</text><text x="536" y="198" class="b">Broken local links, out-of-scope paths,</text><text x="536" y="221" class="b">insecure HTTP references and file discovery</text><text x="536" y="246" class="m">SLLINK001–003</text>
<rect x="970" y="130" width="420" height="132" rx="15" class="c" stroke="#fb7185"/><text x="996" y="166" class="t">Risky commands</text><text x="996" y="198" class="b">Remote script pipelines, destructive removes,</text><text x="996" y="221" class="b">broad permissions and force-push patterns</text><text x="996" y="246" class="m">SLSEC001–008</text>
<rect x="50" y="284" width="420" height="132" rx="15" class="c" stroke="#a78bfa"/><text x="76" y="320" class="t">Tool permission scope</text><text x="76" y="352" class="b">Malformed declarations, broad wildcards,</text><text x="76" y="375" class="b">high-impact command-scoped shell permissions</text><text x="76" y="400" class="m">SLPERM001–003</text>
<rect x="510" y="284" width="420" height="132" rx="15" class="c" stroke="#fbbf24"/><text x="536" y="320" class="t">Instruction consistency</text><text x="536" y="352" class="b">Opposite modal polarity for equivalent</text><text x="536" y="375" class="b">normalized action phrases, within/across files</text><text x="536" y="400" class="m">SLCONF001</text>
<rect x="970" y="284" width="420" height="132" rx="15" class="c" stroke="#39e6cb"/><text x="996" y="320" class="t">Developer / CI output</text><text x="996" y="352" class="b">Text summaries, stable JSON, SARIF 2.1.0,</text><text x="996" y="375" class="b">strict warning gate and actionable advice</text><text x="996" y="400" class="m">exit 0 / exit 1</text>
</g>
<rect x="50" y="452" width="1340" height="83" rx="14" fill="#0e2035" stroke="#294a6b"/><text x="76" y="485" class="t">Signal quality matters</text><text x="76" y="512" class="b">Static patterns are intentionally reviewable. False positives are surfaced with file locations and recommended remediation.</text>
<text x="1370" y="570" text-anchor="end" class="s">RULES DOCUMENTED IN docs/RULES.md</text></svg>